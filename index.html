<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 가로 밀림 현상을 방지하는 모바일 전용 메타 태그 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>생산량 계산기 (모바일 전용)</title>
    <style>
        /* 화면이 우측으로 밀리지 않도록 전체 가로 크기를 제한하고 박스 모델 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f3f5;
            color: #212529;
            padding: 12px;
            display: flex;
            justify-content: center;
            width: 100%;
            overflow-x: hidden; /* 가로 스크롤 절대 발생 방지 */
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 100%; /* 화면 너비에 딱 맞춤 */
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .right-panel {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            width: 100%;
        }

        .card {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            width: 100%;
        }

        .info-box {
            background-color: #e9ecef;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.5;
            border-left: 4px solid #4a90e2;
        }

        /* 찌그러짐 없는 완벽한 50% 반반 분할 그리드 구조 */
        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            width: 100%;
        }

        /* 좌우 정렬 아이템들이 무조건 화면의 반씩 차지하도록 고정 */
        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1 1 calc(50% - 5px);
            min-width: calc(50% - 5px);
        }

        /* 파지량 전용 (한 줄 다 차지) */
        .full-width {
            flex: 1 1 100%;
            min-width: 100%;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #495057;
        }

        /* 모바일 패딩 및 높이 최적화 */
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1.05rem;
            background-color: #fff;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: #4a90e2;
            outline: none;
            background-color: #f8f9fa;
        }

        button {
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .btn-blue { background-color: #4a90e2; }
        .btn-blue:active { background-color: #357abd; }
        .btn-green { background-color: #2ecc71; }
        .btn-green:active { background-color: #27ae60; }
        
        .result-display {
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 6px;
            text-align: right;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid #e9ecef;
        }
        .result-display span {
            color: #4a90e2;
            font-size: 1.3rem;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .history-item {
            padding: 10px 0;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.85rem;
        }
        .history-time { color: #868e96; font-size: 0.75rem; }
        .history-calc { color: #495057; margin: 4px 0; font-family: monospace; font-size: 0.9rem; }
        .history-res { font-weight: bold; text-align: right; color: #4a90e2; font-size: 1rem; }
        
        .clear-btn {
            background-color: #e9ecef;
            color: #495057;
            margin-top: 12px;
            font-weight: normal;
            padding: 8px;
            font-size: 0.85rem;
        }
        .clear-btn:active { background-color: #dee2e6; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 계산 입력 구역 -->
    <div class="left-panel">
        
        <div class="card info-box">
            ⏰ <strong>총 작업:</strong> 12시간 (720분) | ☕ <strong>휴식:</strong> 공석 90분 / 석식 60분
        </div>

        <!-- 공식 1 -->
        <div class="card">
            <h3 style="margin-top:0; color:#212529; font-size:1.05rem; margin-bottom:10px;">공식 1번 계산기 (기본형)</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>LH</label>
                    <input type="number" id="lh1" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>RH</label>
                    <input type="number" id="rh1" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>런너 (Runner)</label>
                    <input type="number" id="runner1" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>총생산량 1번</label>
                    <input type="number" id="total1" value="0" onfocus="this.select();">
                </div>
            </div>
            <button class="btn-blue" onclick="calc1()">공식1 계산하기</button>
            <div class="result-display">결과: <span id="out1">0</span> 개</div>
        </div>

        <!-- 공식 2 -->
        <div class="card">
            <h3 style="margin-top:0; color:#212529; font-size:1.05rem; margin-bottom:10px;">공식 2번 계산기 (+파지량)</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>LH</label>
                    <input type="number" id="lh2" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>RH</label>
                    <input type="number" id="rh2" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>런너 (Runner)</label>
                    <input type="number" id="runner2" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>총생산량</label>
                    <input type="number" id="total2" value="0" onfocus="this.select();">
                </div>
                <div class="form-group full-width">
                    <label>파지량</label>
                    <input type="number" id="scrap2" value="0" onfocus="this.select();">
                </div>
            </div>
            <button class="btn-green" onclick="calc2()">공식2 계산하기</button>
            <div class="result-display">결과: <span id="out2">0</span> 개</div>
        </div>

    </div>

    <!-- 기록 내역 구역 -->
    <div class="right-panel">
        <h3 style="margin-top:0; color:#212529; font-size:1rem; margin-bottom:10px;">📊 최근 생산 기록 (최대 10개)</h3>
        <ul id="logList" class="history-list">
            <li id="noLog" style="color:#868e96; text-align:center; padding:20px 0; font-size:0.85rem;">아직 기록이 없습니다.</li>
        </ul>
        <button class="clear-btn" onclick="clearLogs()">기록 전체 삭제</button>
    </div>
</div>

<script>
    // 기존 기능 동일 유지
    var logs = [];

    function calc1() {
        var lh = parseFloat(document.getElementById('lh1').value) || 0;
        var rh = parseFloat(document.getElementById('rh1').value) || 0;
        var runner = parseFloat(document.getElementById('runner1').value) || 0;
        var total = parseFloat(document.getElementById('total1').value) || 0;

        var sum = (lh + rh + runner) * total;
        document.getElementById('out1').innerHTML = sum.toLocaleString();

        var formula = "(" + lh + " + " + rh + " + " + runner + ") × " + total;
        addLog("공식 1", formula, sum);
    }

    function calc2() {
        var lh = parseFloat(document.getElementById('lh2').value) || 0;
        var rh = parseFloat(document.getElementById('rh2').value) || 0;
        var runner = parseFloat(document.getElementById('runner2').value) || 0;
        var total = parseFloat(document.getElementById('total2').value) || 0;
        var scrap = parseFloat(document.getElementById('scrap2').value) || 0;

        var sum = ((lh + rh + runner) * total) + scrap;
        document.getElementById('out2').innerHTML = sum.toLocaleString();

        var formula = "((" + lh + " + " + rh + " + " + runner + ") × " + total + ") + " + scrap;
        addLog("공식 2", formula, sum);
    }

    function addLog(title, formula, resultValue) {
        var noLogTag = document.getElementById('noLog');
        if(noLogTag) { noLogTag.style.display = 'none'; }

        var d = new Date();
        var timeStr = d.toLocaleTimeString();

        var newRecord = {
            time: timeStr,
            title: title,
            formula: formula,
            res: resultValue.toLocaleString() + " 개"
        };

        logs.unshift(newRecord);

        if(logs.length > 10) {
            logs.pop();
        }

        var logList = document.getElementById('logList');
        logList.innerHTML = "";

        for(var i = 0; i < logs.length; i++) {
            var item = logs[i];
            var li = document.createElement('li');
            li.className = 'history-item';
