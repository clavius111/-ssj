<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면 비율을 맞춰주는 필수 메타 태그 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>생산량 계산기</title>
    <style>
        /* 모바일 퍼스트 및 가독성 중심 스타일 디자인 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f3f5;
            color: #212529;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            display: flex;
            flex-direction: column; /* 모바일에서 위아래로 흐르도록 설정 */
            gap: 16px;
            width: 100%;
            max-width: 500px; /* 스마트폰 한 손 보기 최적화 크기 */
        }
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }
        .right-panel {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
            width: 100%;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }
        .info-box {
            background-color: #e9ecef;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            border-left: 4px solid #4a90e2;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2열 배치 고정 */
            gap: 12px;
            margin-bottom: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .full-width {
            grid-column: span 2;
        }
        label {
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #495057;
        }
        /* 모바일 터치 오타 방지를 위해 입력창 높이와 폰트 확대 */
        input {
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1.1rem;
            background-color: #fff;
            -webkit-appearance: none; /* 아이폰 입력창 기본 음영 제거 */
            box-sizing: border-box;
        }
        input:focus {
            border-color: #4a90e2;
            outline: none;
            background-color: #f8f9fa;
        }
        /* 엄지손가락으로 누르기 편하게 버튼 크기 확대 */
        button {
            width: 100%;
            padding: 15px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
            transition: background-color 0.1s;
        }
        .btn-blue { background-color: #4a90e2; }
        .btn-blue:active { background-color: #357abd; }
        .btn-green { background-color: #2ecc71; }
        .btn-green:active { background-color: #27ae60; }
        
        .result-display {
            margin-top: 12px;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 6px;
            text-align: right;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid #e9ecef;
        }
        .result-display span {
            color: #4a90e2;
            font-size: 1.4rem;
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px; /* 모바일에서 스크롤로 보기 편하게 조절 */
            overflow-y: auto;
        }
        .history-item {
            padding: 12px 0;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.9rem;
        }
        .history-time { color: #868e96; font-size: 0.75rem; }
        .history-calc { color: #495057; margin: 4px 0; font-family: monospace; font-size: 0.95rem; }
        .history-res { font-weight: bold; text-align: right; color: #4a90e2; font-size: 1.05rem; }
        
        .clear-btn {
            background-color: #e9ecef;
            color: #495057;
            margin-top: 15px;
            font-weight: normal;
            padding: 10px;
            font-size: 0.9rem;
        }
        .clear-btn:active { background-color: #dee2e6; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 계산 입력 구역 -->
    <div class="left-panel">
        
        <div class="card info-box">
            ⏰ <strong>총 작업:</strong> 12시간 (720분)<br>
            ☕ <strong>휴식:</strong> 공석 90분 / 석식 60분
        </div>

        <!-- 공식 1 -->
        <div class="card">
            <h3 style="margin-top:0; color:#212529; font-size:1.15rem;">공식 1번 계산기 (기본형)</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>LH</label>
                    <input type="number" id="lh1" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>RH</label>
                    <input type="number" id="rh1" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>런너 (Runner)</label>
                    <input type="number" id="runner1" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>총생산량 1번</label>
                    <input type="number" id="total1" value="0" onfocus="this.select();">
                </div>
            </div>
            <button class="btn-blue" onclick="calc1()">공식1 계산하기</button>
            <div class="result-display">결과: <span id="out1">0</span> 개</div>
        </div>

        <!-- 공식 2 -->
        <div class="card">
            <h3 style="margin-top:0; color:#212529; font-size:1.15rem;">공식 2번 계산기 (+파지량)</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>LH</label>
                    <input type="number" id="lh2" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>RH</label>
                    <input type="number" id="rh2" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>런너 (Runner)</label>
                    <input type="number" id="runner2" value="0" onfocus="this.select();">
                </div>
                <div class="form-group">
                    <label>총생산량</label>
                    <input type="number" id="total2" value="0" onfocus="this.select();">
                </div>
                <div class="form-group full-width">
                    <label>파지량</label>
                    <input type="number" id="scrap2" value="0" onfocus="this.select();">
                </div>
            </div>
            <button class="btn-green" onclick="calc2()">공식2 계산하기</button>
            <div class="result-display">결과: <span id="out2">0</span> 개</div>
        </div>

    </div>

    <!-- 기록 내역 구역 -->
    <div class="right-panel">
        <h3 style="margin-top:0; color:#212529; font-size:1.1rem;">📊 최근 생산 기록 (최대 10개)</h3>
        <ul id="logList" class="history-list">
            <li id="noLog" style="color:#868e96; text-align:center; padding:30px 0; font-size:0.9rem;">아직 기록이 없습니다.</li>
        </ul>
        <button class="clear-btn" onclick="clearLogs()">기록 전체 삭제</button>
    </div>
</div>

<script>
    // 기존 기능 100% 동일 유지 (로직 무수정)
    var logs = [];

    function calc1() {
        var lh = parseFloat(document.getElementById('lh1').value) || 0;
        var rh = parseFloat(document.getElementById('rh1').value) || 0;
        var runner = parseFloat(document.getElementById('runner1').value) || 0;
        var total = parseFloat(document.getElementById('total1').value) || 0;

        var sum = (lh + rh + runner) * total;
        document.getElementById('out1').innerHTML = sum.toLocaleString();

        var formula = "(" + lh + " + " + rh + " + " + runner + ") × " + total;
        addLog("공식 1", formula, sum);
    }

    function calc2() {
        var lh = parseFloat(document.getElementById('lh2').value) || 0;
        var rh = parseFloat(document.getElementById('rh2').value) || 0;
        var runner = parseFloat(document.getElementById('runner2').value) || 0;
        var total = parseFloat(document.getElementById('total2').value) || 0;
        var scrap = parseFloat(document.getElementById('scrap2').value) || 0;

        var sum = ((lh + rh + runner) * total) + scrap;
        document.getElementById('out2').innerHTML = sum.toLocaleString();

        var formula = "((" + lh + " + " + rh + " + " + runner + ") × " + total + ") + " + scrap;
        addLog("공식 2", formula, sum);
    }

    function addLog(title, formula, resultValue) {
        var noLogTag = document.getElementById('noLog');
        if(noLogTag) { noLogTag.style.display = 'none'; }

        var d = new Date();
        var timeStr = d.toLocaleTimeString();

        var newRecord = {
            time: timeStr,
            title: title,
            formula: formula,
            res: resultValue.toLocaleString() + " 개"
        };

        logs.unshift(newRecord);

        if(logs.length > 10) {
            logs.pop();
        }

        var logList = document.getElementById('logList');
        logList.innerHTML = "";

        for(var i = 0; i < logs.length; i++) {
            var item = logs[i];
            var li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = 
                "<div class='history-time'>[" + item.title + "] " + item.time + "</div>" +
                "<div class='history-calc'>" + item.formula + "</div>" +
